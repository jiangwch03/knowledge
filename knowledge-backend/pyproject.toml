[project]
name = "knowledge-backend"
version = "0.0.1"
description = "Knowledge backend"
requires-python = ">=3.13"
dependencies = [
    "knowledge-common>=0.0.1",
    "aiofiles==25.1.0",
    "alembic==1.18.3",
    "anthropic==0.78.0",
    "apscheduler==3.11.2",
    "async-lru==2.1.0",
    "asyncmy==0.2.11",
    "bcrypt==5.0.0",
    "cerebras-cloud-sdk==1.67.0",
    "cohere==5.20.4",
    "google-genai==1.62.0",
    "groq==1.0.0",
    "litellm==1.81.8",
    "llama-api-client==0.6.0",
    "loguru==0.7.3",
    "mistralai==1.12.0",
    "ollama==0.6.1",
    "openai==2.17.0",
    "openpyxl==3.1.5",
    "pandas==2.3.3",
    "pillow==12.1.1",
    "portkey-ai==2.1.0",
    "psutil==7.2.2",
    "pyjwt[crypto]==2.11.0",
    "ruff==0.15.0",
    "sqlalchemy[asyncio]==2.0.46",
    "sqlglot[rs]==28.10.0",
    "textual==8.2.5",
    "uvicorn>=0.48.0",
]

#[build-system]
#requires = ["setuptools"]
#build-backend = "setuptools.build_meta"

#[project.scripts]
#ruoyi = "cli.main:main"
#
#[tool.uv]
#package = false

#[tool.setuptools.packages.find]
#include = ["cli*"]

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_backend"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

# uv 索引配置
[[tool.uv.index]]
name = "nexus"
url = "http://localhost:8081/repository/pypi-group/simple/"
default = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
