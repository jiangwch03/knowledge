[project]
name = "knowledge-retrieval"
version = "1.0.0"
description = "knowledge-retrieval"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "knowledge-common==1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_retrieval"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: requires outbound network or live Milvus/Redis/DB",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
