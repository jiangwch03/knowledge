[project]
name = "knowledge-content"
version = "0.0.1"
description = "knowledge-content"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "knowledge-common>=0.0.1",
    "llama-index>=0.14.22",
    "llama-index-embeddings-langchain>=0.5.0",
    "llama-index-llms-langchain>=0.8.0",
    "uvicorn>=0.48.0",
    "pypdf>=5.0.0",
    "minio>=7.2.20",
]
# 没写 include = [".env*"] 的话，.env.dev 不会被打包 默认只打包py文件
[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_content"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

