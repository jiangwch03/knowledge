[project]
name = "knowledge-content"
version = "1.0.0"
description = "knowledge-content"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "knowledge-common==1.0.0",
    # RAG / 文档索引
    "llama-index==0.14.22",
    "llama-index-embeddings-langchain==0.5.0",
    "llama-index-llms-langchain==0.8.0",
    "langchain-text-splitters>=1.1.1,<2.0.0",
    # 爬虫 Agent 专属
    "crawl4ai==0.9.0",
    # 对象存储
    "minio==7.2.20",
]
# 没写 include = [".env*"] 的话，.env.dev 不会被打包 默认只打包py文件
[project.optional-dependencies]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_content"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = [
    "integration: requires outbound network (milvus.io etc.)",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
