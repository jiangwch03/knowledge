[project]
name = "knowledge-common"
version = "0.0.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "aiomysql>=0.3.2",
    "dotenv>=0.9.9",
    "fastapi>=0.136.3",
    "loguru>=0.7.3",
    "psutil>=7.2.2",
    "pydantic-settings>=2.14.1",
    "redis>=7.4.0",
    "sqlalchemy>=2.0.50",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# uv 索引配置
[[tool.uv.index]]
name = "nexus"
url = "http://localhost:8081/repository/pypi-group/simple/"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
default = true