[project]
name = "knowledge-common"
version = "0.0.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Web / 运行时
    "fastapi==0.136.3",
    "uvicorn==0.49.0",
    "httpx==0.28.1",
    # 数据层
    "sqlalchemy[asyncio]==2.0.46",
    "aiomysql==0.3.2",
    "asyncmy==0.2.11",
    "pymysql==1.1.2",
    "redis==7.4.1",
    # 配置 / 校验
    "dotenv==0.9.9",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.1",
    "pydantic-validation-decorator==0.1.5",
    # LangChain / LangGraph Agent 运行时
    "langchain==1.3.4",
    "langchain-community==0.4.2",
    "langchain-openai==1.1.9",
    "deepagents==0.4.12",
    "langgraph==1.2.4",
    "langgraph-checkpoint-redis==0.5.0",
    # Agno + 多模型 Provider SDK（AiUtil 动态加载）
    "agno==2.6.11",
    "anthropic==0.78.0",
    "cerebras-cloud-sdk==1.67.0",
    "cohere==5.20.4",
    "google-genai==1.62.0",
    "groq==1.0.0",
    "litellm==1.81.8",
    "llama-api-client==0.6.0",
    "mistralai==1.12.0",
    "ollama==0.6.1",
    "openai==2.17.0",
    "portkey-ai==2.1.0",
    # 工具库
    "aiofiles==25.1.0",
    "apscheduler==3.11.2",
    "async-lru==2.1.0",
    "bcrypt==5.0.0",
    "confluent-kafka==2.14.2",
    "cryptography==48.0.0",
    "loguru==0.7.3",
    "openpyxl==3.1.5",
    "pandas==2.3.3",
    "psutil==7.2.2",
    "pypdf==6.12.2",
    "pyjwt[crypto]==2.11.0",
    "python-docx==1.2.0",
    "sqlglot[rs]==28.10.0",
    "user-agents==2.2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.4.0",
]
