[project]
name = "knowledge-common"
version = "0.0.1"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "agno>=2.6.9",
    "aiomysql>=0.3.2",
    "dotenv>=0.9.9",
    "fastapi>=0.136.3",
    "loguru>=0.7.3",
    "psutil>=7.2.2",
    "pydantic-settings>=2.14.1",
    "pydantic>=2.11.4",
    "pydantic-validation-decorator==0.1.5",
    "redis>=7.4.0",
    "sqlalchemy[asyncio]==2.0.46",
    "sqlglot[rs]==28.10.0",
    "ollama==0.6.1",
    "openai==2.17.0",
    "langchain>=0.3.0",
    "langchain-openai>=0.3.0",
    "openpyxl==3.1.5",
    "pandas==2.3.3",
    "cryptography>=48.0.0",
    "bcrypt==5.0.0",
    "aiofiles==25.1.0",
    "apscheduler==3.11.2",
    "async-lru==2.1.0",
    "asyncmy==0.2.11",
    "python-docx>=1.1.2",
    "pypdf>=5.0.0",
    "pymysql==1.1.2",
    "user-agents>=2.2.0",
    "pyjwt[crypto]==2.11.0",
    "confluent-kafka>=2.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
]

